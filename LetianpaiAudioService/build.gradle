plugins {
    id 'com.android.application'
}

android {
    namespace 'com.letianpai.robot.audioservice'
    compileSdk 36

    defaultConfig {
        applicationId "com.letianpai.robot.audioservice"
        minSdk 30
        targetSdk 36
        versionCode 2401181
        versionName "1.1." + versionCode
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def keystoreFile = file('../keystore/letianpai.jks')
    signingConfigs {

        config {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                keyAlias 'letianpai'
                keyPassword findProperty('LETIANPAI_KEY_PASSWORD') ?: ''
                storePassword findProperty('LETIANPAI_STORE_PASSWORD') ?: ''
            }
        }

    }

    buildTypes {
        debug {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.config
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.config
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.1'
    api project(':CommandLib')
}