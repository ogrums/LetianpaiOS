[versions]
agp = "8.13.0"
kotlin = "2.0.21"
java = "17"
compileSdk = "36"
minSdk = "30"
targetSdk = "36"
coreKtx = "1.15.0"
appcompat = "1.7.0"
viewpager = "1.1.0"
annotation = "1.9.1"
localbroadcastmanager = "1.1.0"
gson = "2.11.0"
okhttp = "4.12.0"
okio = "3.9.1"
junit = "4.13.2"
# Face views call the Glide 3 API. Jetifier rewrites this jar. Do not bump without changing call sites.
glide = "3.7.0"
# guideLib layouts use the Lottie 2 API. Same constraint as Glide.
lottie = "2.6.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-viewpager = { group = "androidx.viewpager", name = "viewpager", version.ref = "viewpager" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[bundles]
okhttp = ["okhttp", "okio"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
